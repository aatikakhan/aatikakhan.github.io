<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aatika Khan</title>
    <script>
      var location = window.location
      location.replace(
        location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          '/?/' +
          location.pathname.slice(1).replace(/&/g, '~and~') +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
      )
    </script>
  </head>
  <body></body>
</html>
